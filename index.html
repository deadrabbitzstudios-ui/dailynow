<head>

<style>

<script>
"use strict";


/* =========================================================
   CONFIG
========================================================= */

const CLIENT_ID =
"50b5323e6e4b47c7a3c8637244d6fd50";

const REDIRECT_URI =
"https://deadrabbitzstudios-ui.github.io/dailynow/";

const TOKEN_KEY =
"daily_access_token_v6";

const VERIFIER_KEY =
"daily_pkce_verifier_v6";

const DATA_KEY =
"daily_data_v6";


/*
These scopes do NOT require Premium.

We intentionally don't request
streaming/playback scopes.
*/

const SCOPES =
"user-read-private user-read-email user-top-read user-library-read";


/* =========================================================
   HELPERS
========================================================= */

function $(id){
    return document.getElementById(id);
}


function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/*
IMPORTANT FIX:

The old version crashed because shuffle()
didn't exist.

This is a complete Fisher-Yates shuffle.
*/

function shuffle(array){

    const result =
        [...array];

    for(
        let i=result.length-1;
        i>0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() *
                (i+1)
            );

        [
            result[i],
            result[j]
        ] =
        [
            result[j],
            result[i]
        ];

    }

    return result;
}


function pickRandom(array,count){

    return shuffle(array)
        .slice(0,count);

}


function todayKey(){

    return new Date()
        .toISOString()
        .slice(0,10);

}


function weekKey(){

    const date =
        new Date();

    const year =
        date.getUTCFullYear();

    const start =
        Date.UTC(
            year,
            0,
            1
        );

    const day =
        Math.floor(
            (
                date.getTime() -
                start
            ) /
            86400000
        );

    const week =
        Math.floor(
            (
                day +
                new Date(start)
                    .getUTCDay()
            ) / 7
        ) + 1;

    return (
        year +
        "-W" +
        String(week)
            .padStart(2,"0")
    );

}


/* =========================================================
   LOCAL DATA
========================================================= */

function defaultData(){

    return {

        version:6,

        journeys:{},

        history:{},

        ratings:{},

        seenAlbums:[],

        rerolls:{},

        settings:{
            accent:"#2684ff"
        }

    };

}


function loadData(){

    try{

        const saved =
            localStorage.getItem(
                DATA_KEY
            );

        if(!saved)
            return defaultData();

        const parsed =
            JSON.parse(saved);

        const base =
            defaultData();

        return {

            ...base,
            ...parsed,

            journeys:
                parsed.journeys || {},

            history:
                parsed.history || {},

            ratings:
                parsed.ratings || {},

            seenAlbums:
                Array.isArray(
                    parsed.seenAlbums
                )
                ? parsed.seenAlbums
                : [],

            rerolls:
                parsed.rerolls || {},

            settings:{
                ...base.settings,
                ...(parsed.settings || {})
            }

        };

    }catch(error){

        console.error(error);

        return defaultData();

    }

}


let data =
    loadData();


function saveData(){

    localStorage.setItem(
        DATA_KEY,
        JSON.stringify(data)
    );

}


/* =========================================================
   ERROR SYSTEM
========================================================= */

function dailyError(
    code,
    message,
    spotify=null
){

    console.error(
        "[DAILY]",
        code,
        message,
        spotify
    );

    let text =
`Daily Error: ${code}

${message}`;


    if(spotify){

        text +=
`

Spotify Error:
${spotify.status || "Unknown"} ${
    spotify.statusText || ""
}

${
    spotify.message ||
    "No additional Spotify error information was provided."
}`;

    }


    $("status")
        .className =
        "status error";


    $("status")
        .innerHTML = `

<strong>
Daily encountered an error.
</strong>

<div class="error-code">
${escapeHTML(text)}
</div>

`;

}


/* =========================================================
   SPOTIFY API
========================================================= */

let accessToken =
    localStorage.getItem(
        TOKEN_KEY
    );


async function spotifyAPI(
    endpoint,
    options={}
){

    if(!accessToken){

        throw {

            dailyCode:
                "NOT_CONNECTED",

            message:
                "Spotify is not connected."

        };

    }


    let response;


    try{

        response =
            await fetch(
                "https://api.spotify.com/v1" +
                endpoint,
                {

                    ...options,

                    headers:{
                        Authorization:
                            "Bearer " +
                            accessToken,

                        ...(options.headers || {})

                    }

                }
            );

    }catch(error){

        throw {

            dailyCode:
                "SPOTIFY_NETWORK_ERROR",

            message:
                "Daily could not connect to Spotify. Check your internet connection.",

            raw:
                error.message

        };

    }


    const text =
        await response.text();


    let json=null;


    try{

        json =
            text
            ? JSON.parse(text)
            : null;

    }catch{

        json=null;

    }


    if(!response.ok){

        if(response.status===401){

            localStorage.removeItem(
                TOKEN_KEY
            );

            accessToken=null;

        }


        throw {

            dailyCode:
                "SPOTIFY_HTTP_" +
                response.status,

            message:
                json?.error?.message ||
                "Spotify returned an HTTP error.",

            status:
                response.status,

            statusText:
                response.statusText,

            raw:
                text.slice(0,1000)

        };

    }


    if(!json){

        throw {

            dailyCode:
                "SPOTIFY_INVALID_JSON",

            message:
                "Spotify returned invalid data.",

            status:
                response.status,

            statusText:
                response.statusText,

            raw:
                text.slice(0,1000)

        };

    }


    return json;

}


/* =========================================================
   PKCE
========================================================= */

function base64URL(buffer){

    return btoa(
        String.fromCharCode(
            ...new Uint8Array(buffer)
        )
    )
    .replace(/\+/g,"-")
    .replace(/\//g,"_")
    .replace(/=+$/,"");

}


async function createChallenge(
    verifier
){

    const digest =
        await crypto.subtle.digest(
            "SHA-256",
            new TextEncoder()
                .encode(verifier)
        );

    return base64URL(digest);

}


async function loginSpotify(){

    try{

        const random =
            crypto.getRandomValues(
                new Uint8Array(64)
            );

        const verifier =
            base64URL(random);


        const challenge =
            await createChallenge(
                verifier
            );


        localStorage.setItem(
            VERIFIER_KEY,
            verifier
        );


        const params =
            new URLSearchParams({

                client_id:
                    CLIENT_ID,

                response_type:
                    "code",

                redirect_uri:
                    REDIRECT_URI,

                code_challenge_method:
                    "S256",

                code_challenge:
                    challenge,

                scope:
                    SCOPES

            });


        window.location.href =
            "https://accounts.spotify.com/authorize?" +
            params.toString();

    }catch(error){

        dailyError(
            "PKCE_LOGIN_ERROR",
            error.message ||
            "Could not start Spotify login."
        );

    }

}


/* =========================================================
   AUTH CALLBACK
========================================================= */

async function handleCallback(){

    const params =
        new URLSearchParams(
            window.location.search
        );


    const error =
        params.get("error");

    const code =
        params.get("code");


    if(error){

        dailyError(
            "SPOTIFY_AUTHORIZATION_DENIED",
            "Spotify denied the authorization request: " +
            error
        );

        history.replaceState(
            {},
            document.title,
            REDIRECT_URI
        );

        return;

    }


    if(!code)
        return;


    const verifier =
        localStorage.getItem(
            VERIFIER_KEY
        );


    if(!verifier){

        dailyError(
            "PKCE_VERIFIER_MISSING",
            "Daily could not find the PKCE verifier used to start Spotify login. Please connect Spotify again."
        );

        return;

    }


    try{

        const response =
            await fetch(
                "https://accounts.spotify.com/api/token",
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/x-www-form-urlencoded"
                    },

                    body:
                        new URLSearchParams({

                            client_id:
                                CLIENT_ID,

                            grant_type:
                                "authorization_code",

                            code:
                                code,

                            redirect_uri:
                                REDIRECT_URI,

                            code_verifier:
                                verifier

                        })

                }
            );


        const text =
            await response.text();


        let json=null;


        try{

            json =
                JSON.parse(text);

        }catch{}


        if(
            !response.ok ||
            !json?.access_token
        ){

            throw {

                status:
                    response.status,

                statusText:
                    response.statusText,

                message:
                    json?.error_description ||
                    json?.error ||
                    "Spotify did not return an access token."

            };

        }


        accessToken =
            json.access_token;


        localStorage.setItem(
            TOKEN_KEY,
            accessToken
        );


        localStorage.removeItem(
            VERIFIER_KEY
        );


        history.replaceState(
            {},
            document.title,
            REDIRECT_URI
        );


    }catch(error){

        dailyError(
            "SPOTIFY_TOKEN_EXCHANGE_FAILED",
            "Daily could not complete Spotify authorization.",
            error
        );

    }

}


/* =========================================================
   GENRES
========================================================= */

const GENRES = [

    "alternative",
    "ambient",
    "blues",
    "classical",

/* =========================================================
   SEARCH ARTISTS
========================================================= */

/*
Spotify now limits search requests to
10 results.

Instead of requesting 50 at once,
we request five pages of 10.
*/

async function searchArtists(
    genre
){

    const query =
        genre
        ? `genre:"${genre}"`
        : "year:2020-2026";


    let artists=[];


    for(
        let offset=0;
        offset<50;
        offset+=10
    ){

        const params =
            new URLSearchParams({

                q:
                    query,

                type:
                    "artist",

                limit:
                    "10",

                offset:
                    String(offset)

            });


        const result =
            await spotifyAPI(
                "/search?" +
                params.toString()
            );


        const batch =
            result
            .artists
            ?.items || [];


        artists.push(
            ...batch
        );


        if(
            batch.length < 10
        )
            break;

    }


    const unique =
        new Map();


    for(
        const artist
        of artists
    ){

        if(!artist?.id)
            continue;

        unique.set(
            artist.id,
            artist
        );

    }


    return [
        ...unique.values()
    ];

}


/* =========================================================
   ARTIST ALBUMS
========================================================= */

async function getArtistAlbums(
    artist
){

    const params =
        new URLSearchParams({

            include_groups:
                "album",

            limit:
                "10",

            market:
                "US"

        });


    const result =
        await spotifyAPI(
            "/artists/" +
            encodeURIComponent(
                artist.id
            ) +
            "/albums?" +
            params.toString()
        );


    return (
        result.items || []
    )
    .filter(
        album =>
            album.album_type ===
            "album"
    )
    .map(
        album => ({

            id:
                album.id,

            name:
                album.name,

            artist:
                album.artists?.[0]
                    ?.name ||
                artist.name,

            image:
                album.images?.[0]
                    ?.url ||
                "",

            releaseDate:
                album.release_date ||
                "",

            url:
                album.external_urls
                    ?.spotify ||
                `https://open.spotify.com/album/${album.id}`,

            artistGenres:
                artist.genres || []

        })
    );

}


/* =========================================================
   COLLECT CANDIDATES
========================================================= */

async function collectCandidates(
    genre
){

    const artists =
        await searchArtists(
            genre
        );


    if(!artists.length){

        throw {

            dailyCode:
                "NO_ARTISTS_FOUND",

            message:
                `Spotify returned no artists for "${genre || "Any Genre"}".`

        };

    }


    /*
    Randomize the artists so Daily does
    not always start with the same ones.
    */

    const randomizedArtists =
        shuffle(
            artists
        );


    let albums=[];


    /*
    We use 15 artists at most.
    */

    for(
        const artist of
        randomizedArtists.slice(0,15)
    ){

        try{

            const artistAlbums =
                await getArtistAlbums(
                    artist
                );

            albums.push(
                ...artistAlbums
            );

        }catch(error){

            console.warn(
                "Album request failed:",
                artist.name,
                error
            );

        }

    }


    /*
    Remove duplicate albums.
    */

    const unique =
        new Map();


    for(
        const album of albums
    ){

        if(
            !album.id ||
            !album.image
        )
            continue;

        unique.set(
            album.id,
            album
        );

    }


    return [
        ...unique.values()
    ];

}


/* =========================================================
   FILTER GENRE
========================================================= */

function genreMatches(
    album,
    selectedGenre
){

    if(!selectedGenre)
        return true;


    const wanted =
        selectedGenre
        .toLowerCase()
        .replaceAll("-"," ");


    const genres =
        album.artistGenres || [];


    return genres.some(
        genre => {

            const normalized =
                genre
                .toLowerCase()
                .replaceAll("-"," ");

            return (
                normalized === wanted ||
                normalized.includes(wanted) ||
                wanted.includes(normalized)
            );

        }
    );

}


/* =========================================================
   REMOVE SEEN
========================================================= */

function removeSeen(
    albums
){

    const seen =
        new Set(
            data.seenAlbums
        );


    return albums.filter(
        album =>
            !seen.has(
                album.id
            )
    );

}


/* =========================================================
   GENERATE DAILY
========================================================= */

async function generateDaily(
    force=false
){

    if(!accessToken){

        dailyError(
            "NOT_CONNECTED",
            "Connect your Spotify account before creating a Daily."
        );

        return;

    }


    const date =
        todayKey();


    if(
        data.journeys[date] &&
        !force
    ){

        renderJourney(
            data.journeys[date]
        );

        return;

    }


    $("generateButton")
        .disabled=true;

    $("rerollButton")
        .disabled=true;


    $("status")
        .className=
        "status";


    $("status")
        .textContent=
        "Daily is searching Spotify for something good…";


    try{

        const selectedGenre =
            $("genreSelect")
                .value;


        let candidates =
            await collectCandidates(
                selectedGenre
            );


        /*
        Apply the selected genre again
        after receiving the actual artist
        metadata.
        */

        candidates =
            candidates.filter(
                album =>
                    genreMatches(
                        album,
                        selectedGenre
                    )
            );


        candidates =
            removeSeen(
                candidates
            );


        if(
            candidates.length < 3
        ){

            throw {

                dailyCode:
                    "NOT_ENOUGH_NEW_ALBUMS",

                message:
                    "Spotify did not provide three new albums matching this genre. Try Any Genre or another genre."

            };

        }


        /*
        Multiple shuffle passes make the
        selection less deterministic.
        */

        candidates =
            shuffle(candidates);

        candidates =
            shuffle(candidates);

        candidates =
            shuffle(candidates);


        const selected =
            pickRandom(
                candidates,
                3
            );


        const albums =
            selected.map(
                album => ({

                    ...album,

                    completed:false,

                    completedAt:null

                })
            );


        data.journeys[date]={

            date:

                date,

            genre:

                selectedGenre ||
                "Any Genre",

            albums:

                albums,

            createdAt:

                new Date()
                    .toISOString()

        };


        for(
            const album of albums
        ){

            if(
                !data.seenAlbums
                    .includes(
                        album.id
                    )
            ){

                data.seenAlbums
                    .push(
                        album.id
                    );

            }

        }


        saveData();


        renderJourney(
            data.journeys[date]
        );


        renderHistory();
        renderCalendar();


        $("status")
            .className=
            "status success";


        $("status")
            .textContent=
            "Daily created — three albums waiting for you.";

    }catch(error){

        dailyError(
            error.dailyCode ||
            "DAILY_GENERATION_ERROR",

            error.message ||
            "Daily could not create your journey.",

            error.status
            ? error
            : null
        );

    }finally{

        $("generateButton")
            .disabled=false;

        $("rerollButton")
            .disabled=false;

        updateRerolls();

    }

}


/* =========================================================
   RENDER JOURNEY
========================================================= */

function renderJourney(
    journey
){

    if(
        !journey ||
        !journey.albums?.length
    ){

        $("albumGrid")
            .innerHTML=`
                <div class="empty">
                    No Daily loaded.
                </div>
            `;

        return;

    }


    $("subtitle")
        .textContent=
        `${journey.genre} • ${journey.date}`;


    $("albumGrid")
        .innerHTML="";


    journey.albums.forEach(
        (album,index)=>{

            const rating =
                data.ratings[
                    album.id
                ]?.stars || 0;


            const card =
                document.createElement(
                    "article"
                );


            card.className=
                "album-card";


            card.innerHTML=`

                <img
                    class="album-cover"
                    src="${escapeHTML(album.image)}"
                    alt=""
                >

                <div class="album-content">

                    <div class="album-number">
                        ALBUM ${index+1}
                        ${
                            album.completed
                            ? " • COMPLETED"
                            : ""
                        }
                    </div>

                    <h2 class="album-name">
                        ${escapeHTML(album.name)}
                    </h2>

                    <div class="artist">
                        ${escapeHTML(album.artist)}
                    </div>

                    <div class="album-meta">

                        Released:
                        ${escapeHTML(
                            album.releaseDate
                        )}

                        <br>

                        ${
                            (album.artistGenres||[])
                            .slice(0,5)
                            .map(
                                genre =>
                                `<span class="genre-tag">
                                    ${escapeHTML(genre)}
                                </span>`
                            )
                            .join("")
                        }

                    </div>

                    <div class="stars">

                        ${
                            [1,2,3,4,5]
                            .map(
                                star =>
                                `
                                <button
                                    class="star ${
                                        star<=rating
                                        ? "active"
                                        : ""
                                    }"
                                    data-star="${star}"
                                >
                                    ★
                                </button>
                                `
                            )
                            .join("")
                        }

                    </div>

                    <div class="album-actions">

                        <button
                            class="btn primary"
                            data-open
                        >
                            Open in Spotify
                        </button>

                        <button
                            class="btn"
                            data-complete
                        >
                            ${
                                album.completed
                                ? "Unfinish"
                                : "Mark Finished"
                            }
                        </button>

                    </div>

                </div>

            `;


            card.querySelector(
                "[data-open]"
            ).onclick=
                ()=>{
                    window.open(
                        album.url,
                        "_blank",
                        "noopener,noreferrer"
                    );
                };


            card.querySelector(
                "[data-complete]"
            ).onclick=
                ()=>{
                    toggleComplete(
                        journey.date,
                        album.id
                    );
                };


            card.querySelectorAll(
                "[data-star]"
            ).forEach(
                button=>{

                    button.onclick=
                        ()=>{
                            rateAlbum(
                                album.id,
                                Number(
                                    button.dataset.star
                                )
                            );
                        };

                }
            );


            $("albumGrid")
                .appendChild(
                    card
                );

        }
    );

}


/* =========================================================
   COMPLETE
========================================================= */

function toggleComplete(
    date,
    albumID
){

    const journey =
        data.journeys[
            date
        ];


    if(!journey)
        return;


    const album =
        journey.albums.find(
            item =>
                item.id===albumID
        );


    if(!album)
        return;


    album.completed =
        !album.completed;


    album.completedAt =
        album.completed
        ? new Date().toISOString()
        : null;


    data.history[
        album.id
    ]={

        ...album,

        dailyDate:
            date,

        rating:
            data.ratings[
                album.id
            ]?.stars || 0

    };


    saveData();


    renderJourney(
        journey
    );

    renderHistory();
    renderCalendar();


    if(
        journey.albums.every(
            item =>
                item.completed
        )
    ){

        $("status")
            .className=
            "status success";


        $("status")
            .textContent=
            "Journey complete! 🎉";

    }

}


/* =========================================================
   RATING
========================================================= */

function rateAlbum(
    albumID,
    stars
){

    if(
        stars<1 ||
        stars>5
    ){

        dailyError(
            "INVALID_RATING",
            "Ratings must be between 1 and 5 stars."
        );

        return;

    }


    data.ratings[
        albumID
    ]={

        stars:
            stars,

        ratedAt:
            new Date().toISOString()

    };


    if(
        data.history[
            albumID
        ]
    ){

        data.history[
            albumID
        ].rating=
            stars;

    }


    saveData();


    const journey =
        data.journeys[
            todayKey()
        ];


    if(journey)
        renderJourney(
            journey
        );


    renderHistory();

}


/* =========================================================
   REROLLS
========================================================= */

function updateRerolls(){

    const week =
        weekKey();


    const used =
        data.rerolls[
            week
        ] || 0;


    const remaining =
        Math.max(
            0,
            3-used
        );


    $("rerollCount")
        .textContent=
        remaining;

}


async function reroll(){

    const week =
        weekKey();


    const used =
        data.rerolls[
            week
        ] || 0;


    if(
        used>=3
    ){

        dailyError(
            "REROLL_LIMIT_REACHED",
            "You have used all 3 rerolls for this week."
        );

        return;

    }


    data.rerolls[
        week
    ]=
        used+1;


    saveData();


    updateRerolls();


    await generateDaily(
        true
    );

}


/* =========================================================
   RESET TODAY
========================================================= */

function resetToday(){

    const date =
        todayKey();


    const journey =
        data.journeys[
            date
        ];


    if(!journey){

        $("status")
            .textContent=
            "There is no Daily to reset today.";

        return;

    }


    if(
        !confirm(
            "Reset today's Daily?"
        )
    )
        return;


    for(
        const album of
        journey.albums
    ){

        data.seenAlbums =
            data.seenAlbums
            .filter(
                id =>
                    id!==album.id
            );

        delete data.history[
            album.id
        ];

    }


    delete data.journeys[
        date
    ];


    saveData();


    $("albumGrid")
        .innerHTML=`
            <div class="empty">
                Today's Daily has been reset.
                You can generate another one.
            </div>
        `;


    $("status")
        .className=
        "status";


    $("status")
        .textContent=
        "Today's Daily has been reset.";

}


/* =========================================================
   HISTORY
========================================================= */

function renderHistory(){

    const items =
        Object.values(
            data.history
        )
        .sort(
            (a,b)=>
                (
                    b.completedAt ||
                    b.dailyDate ||
                    ""
                )
                .localeCompare(
                    a.completedAt ||
                    a.dailyDate ||
                    ""
                )
        );


    if(!items.length){

        $("history")
            .innerHTML=`
                <div class="empty">
                    Your completed albums will appear here.
                </div>
            `;

        return;

    }


    $("history")
        .innerHTML=
        items.map(
            album=>{

                const rating =
                    data.ratings[
                        album.id
                    ]?.stars || 0;


                return `

                <div class="history-item">

                    <img
                        class="history-image"
                        src="${escapeHTML(
                            album.image
                        )}"
                    >

                    <div class="history-info">

                        <strong>
                            ${escapeHTML(
                                album.name
                            )}
                        </strong>

                        <div class="muted">
                            ${escapeHTML(
                                album.artist
                            )}
                        </div>

                        <div class="muted">
                            Daily:
                            ${escapeHTML(
                                album.dailyDate
                            )}
                        </div>

                        <div>

                            ${
                                album.completed
                                ? "✓ Completed"
                                : "Not completed"
                            }

                            ${
                                rating
                                ? ` • ★ ${rating}/5`
                                : ""
                            }

                        </div>

                    </div>

                    <button
                        class="btn"
                        data-rate-history="${escapeHTML(
                            album.id
                        )}"
                    >
                        Rate
                    </button>

                </div>

                `;

            }
        )
        .join("");


    document
        .querySelectorAll(
            "[data-rate-history]"
        )
        .forEach(
            button=>{

                button.onclick=
                    ()=>{

                        const album =
                            data.history[
                                button
                                .dataset
                                .rateHistory
                            ];

                        if(!album)
                            return;


                        const current =
                            data.ratings[
                                album.id
                            ]?.stars || "";


                        const answer =
                            prompt(
                                `Rate "${album.name}" from 1 to 5.`,
                                current
                            );


                        if(
                            answer===null
                        )
                            return;


                        const rating =
                            Number(
                                answer
                            );


                        if(
                            !Number.isInteger(
                                rating
                            ) ||
                            rating<1 ||
                            rating>5
                        ){

                            dailyError(
                                "INVALID_RATING",
                                "Please enter a whole number from 1 to 5."
                            );

                            return;

                        }


                        rateAlbum(
                            album.id,
                            rating
                        );

                    };

            }
        );

}


/* =========================================================
   CALENDAR
========================================================= */

let calendarDate =
    new Date();


function renderCalendar(){

    const year =
        calendarDate
        .getFullYear();

    const month =
        calendarDate
        .getMonth();


    $("monthTitle")
        .textContent=
        calendarDate.toLocaleString(
            undefined,
            {
                month:"long",
                year:"numeric"
            }
        );


    const first =
        new Date(
            year,
            month,
            1
        );


    const last =
        new Date(
            year,
            month+1,
            0
        );


    let html="";


    [
        "Sun",
        "Mon",
        "Tue",
        "Wed",
        "Thu",
        "Fri",
        "Sat"
    ]
    .forEach(
        day=>{
            html+=`
                <div class="muted">
                    <strong>
                        ${day}
                    </strong>
                </div>
            `;
        }
    );


    for(
        let i=0;
        i<first.getDay();
        i++
    ){

        html+=
            "<div></div>";

    }


    for(
        let day=1;
        day<=last.getDate();
        day++
    ){

        const date =
            `${year}-${String(month+1)
                .padStart(2,"0")}-${String(day)
                .padStart(2,"0")}`;


        const journey =
            data.journeys[
                date
            ];


        const completed =
            Object.values(
                data.history
            )
            .filter(
                album =>
                    album.dailyDate===date &&
                    album.completed
            );


        html+=`

            <div
                class="calendar-day ${
                    completed.length
                    ? "completed"
                    : ""
                }"
            >

                <div class="calendar-day-number">
                    ${day}
                </div>

                ${
                    journey
                    ? `
                        <div class="muted">
                            ${escapeHTML(
                                journey.genre
                            )}
                        </div>
                    `
                    : ""
                }

                ${
                    completed.length
                    ? `
                        <div class="calendar-dot"></div>
                        <div>
                            ${completed.length}
                            finished
                        </div>
                    `
                    : ""
                }

            </div>

        `;

    }


    $("calendar")
        .innerHTML=
        html;

}


/* =========================================================
   EXPORT DND
========================================================= */

function exportDND(){

    const file={

        format:
            "DAILY_DND",

        version:
            6,

        application:
            "Daily",

        exportedAt:
            new Date()
            .toISOString(),

        data:
            data

    };


    const blob =
        new Blob(
            [
                JSON.stringify(
                    file,
                    null,
                    2
                )
            ],
            {
                type:
                    "application/json"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const a =
        document.createElement(
            "a"
        );


    a.href=
        url;

    a.download=
        `Daily-${todayKey()}.dnd`;


    document.body
        .appendChild(a);


    a.click();


    a.remove();


    URL.revokeObjectURL(
        url
    );

}


/* =========================================================
   IMPORT DND
========================================================= */

function importDND(file){

    const reader =
        new FileReader();


    reader.onload=
        ()=>{

            try{

                const imported =
                    JSON.parse(
                        reader.result
                    );


                if(
                    imported.format!==
                    "DAILY_DND"
                ){

                    throw new Error(
                        "This is not a Daily .dnd file."
                    );

                }


                if(
                    !imported.data
                ){

                    throw new Error(
                        "The .dnd file contains no Daily data."
                    );

                }


                data =
                    imported.data;


                saveData();

                applyAccent();

                renderHistory();

                renderCalendar();

                updateRerolls();


                const today =
                    data.journeys[
                        todayKey()
                    ];


                if(today)
                    renderJourney(
                        today
                    );


                $("status")
                    .className=
                    "status success";


                $("status")
                    .textContent=
                    "Daily data imported successfully.";

            }catch(error){

                dailyError(
                    "DND_IMPORT_FAILED",
                    error.message
                );

            }

        };


    reader.readAsText(
        file
    );

}


/* =========================================================
   SETTINGS
========================================================= */

function applyAccent(){

    const color =
        data.settings
            ?.accent ||
        "#2684ff";


    document.documentElement
        .style
        .setProperty(
            "--accent",
            color
        );


    $("accentColor")
        .value=
        color;

}


$("settingsButton")
    .onclick=
    ()=>{
        $("settingsModal")
            .classList
            .add("open");
    };


$("closeSettings")
    .onclick=
    ()=>{
        $("settingsModal")
            .classList
            .remove("open");
    };


$("accentColor")
    .oninput=
    event=>{

        data.settings.accent =
            event.target.value;

        saveData();

        applyAccent();

    };


$("exportButton")
    .onclick=
    exportDND;


$("importButton")
    .onclick=
    ()=>{
        $("importFile")
            .click();
    };


$("importFile")
    .onchange=

        const file =

        if(file)

    };


$("clearDataButton")
    .onclick=
    ()=>{

        if(
            !confirm(
                "Reset ALL Daily data?"
            )
        )
            return;


        data =
            defaultData();


        saveData();


        location.reload();

    };


/* =========================================================
   BUTTONS
========================================================= */

$("spotifyButton")
    .onclick=
    ()=>{

        if(accessToken){

            window.open(
                "https://open.spotify.com/",
                "_blank",
                "noopener,noreferrer"

$("generateButton")
    .onclick=

$("nextMonth")

    ()=>{

        calendarDate

                calendarDate.getMonth()+1
            );

    };


/* =========================================================
   INITIALIZATION
========================================================= */

async function init(){

    applyAccent();

    updateRerolls();

    renderCalendar();

    renderHistory();


    await handleCallback();


    if(!accessToken){

        $("albumGrid")
            .innerHTML=`
                <div class="empty">
                    Connect Spotify to start discovering albums.
                </div>
            `;

        return;

    }


    try{

        const profile =
            await spotifyAPI(
                "/me"
            );


        $("spotifyButton")
            .textContent=
            profile.display_name ||
            profile.id ||
            "Spotify";

            .className=
            "status success";


        $("status")
            .textContent=
            `Spotify connected as ${
                profile.display_name ||
                profile.id
            }.`;


        const today =
            data.journeys[
                todayKey()
            ];


        if(today){

            renderJourney(
                today
            );

        }else{

            $("albumGrid")
                .innerHTML=`
                    <div class="empty">
                        Click
                        <strong>
                            Get Today's Daily
                        </strong>
                        to discover three albums.
                    </div>
                `;

        }

    }catch(error){

        dailyError(
            error.dailyCode ||
            "SPOTIFY_ACCOUNT_LOAD_FAILED",

            error.message ||
            "Daily could not load your Spotify account.",

            error.status
            ? error
            : null
        );

    }

}


init();
